<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" opacity="0.07">
  <!-- Guitar body -->
  <ellipse cx="520" cy="380" rx="180" ry="220" fill="#e94560"/>
  <ellipse cx="520" cy="380" rx="150" ry="190" fill="#0f0f1a"/>
  <ellipse cx="520" cy="380" rx="40" ry="40" fill="none" stroke="#e94560" stroke-width="3"/>
  
  <!-- Upper bout -->
  <ellipse cx="480" cy="200" rx="100" ry="120" fill="#e94560"/>
  <ellipse cx="480" cy="200" rx="80" ry="100" fill="#0f0f1a"/>
  
  <!-- Waist connection -->
  <path d="M420 200 Q380 290 400 380" stroke="#e94560" stroke-width="20" fill="none"/>
  <path d="M540 200 Q600 290 640 380" stroke="#e94560" stroke-width="20" fill="none"/>
  
  <!-- Neck -->
  <rect x="455" y="20" width="50" height="200" rx="4" fill="#e94560"/>
  
  <!-- Headstock -->
  <rect x="448" y="0" width="64" height="40" rx="8" fill="#e94560"/>
  
  <!-- Tuning pegs -->
  <circle cx="458" cy="10" r="5" fill="#f5a623"/>
  <circle cx="458" cy="25" r="5" fill="#f5a623"/>
  <circle cx="458" cy="40" r="5" fill="#f5a623"/>
  <circle cx="502" cy="10" r="5" fill="#f5a623"/>
  <circle cx="502" cy="25" r="5" fill="#f5a623"/>
  <circle cx="502" cy="40" r="5" fill="#f5a623"/>
  
  <!-- Strings -->
  <line x1="462" y1="40" x2="462" y2="560" stroke="#e94560" stroke-width="1" opacity="0.5"/>
  <line x1="470" y1="40" x2="470" y2="560" stroke="#e94560" stroke-width="1" opacity="0.4"/>
  <line x1="478" y1="40" x2="478" y2="560" stroke="#e94560" stroke-width="1" opacity="0.3"/>
  <line x1="486" y1="40" x2="486" y2="560" stroke="#e94560" stroke-width="1" opacity="0.3"/>
  <line x1="494" y1="40" x2="494" y2="560" stroke="#e94560" stroke-width="1" opacity="0.4"/>
  <line x1="502" y1="40" x2="502" y2="560" stroke="#e94560" stroke-width="1" opacity="0.5"/>
  
  <!-- Frets -->
  <line x1="455" y1="60" x2="505" y2="60" stroke="#f5a623" stroke-width="1.5" opacity="0.3"/>
  <line x1="455" y1="90" x2="505" y2="90" stroke="#f5a623" stroke-width="1.5" opacity="0.3"/>
  <line x1="455" y1="118" x2="505" y2="118" stroke="#f5a623" stroke-width="1.5" opacity="0.3"/>
  <line x1="455" y1="144" x2="505" y2="144" stroke="#f5a623" stroke-width="1.5" opacity="0.3"/>
  <line x1="455" y1="168" x2="505" y2="168" stroke="#f5a623" stroke-width="1.5" opacity="0.3"/>
  <line x1="455" y1="190" x2="505" y2="190" stroke="#f5a623" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Fret markers -->
  <circle cx="480" cy="105" r="4" fill="#f5a623" opacity="0.3"/>
  <circle cx="480" cy="156" r="4" fill="#f5a623" opacity="0.3"/>
  
  <!-- Bridge -->
  <rect x="470" y="520" width="100" height="8" rx="2" fill="#e94560" opacity="0.6"/>
  
  <!-- Pickguard suggestion -->
  <path d="M440 320 Q400 350 420 420 Q440 480 500 460" stroke="#e94560" stroke-width="2" fill="none" opacity="0.3"/>
